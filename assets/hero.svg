ount="indefinite" keyTimes="0;.74;.75;0.930;0.940;1" values="1;1;0;0;1;1"/><text x="740" y="233" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#F0B44C" text-anchor="start" >Answer</text><text x="854" y="233" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="15" font-weight="400" fill="#F0B44C" text-anchor="start" >open to AI/ML roles</text></g><line x1="90" y1="312" x2="1070" y2="312" stroke="#3C4F49" stroke-width="2"/><circle r="10" fill="#F0B44C" opacity=".35" filter="url(#glow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M90 312H1070"/></circle><circle r="5" fill="#F0B44C"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M90 312H1070"/></circle><circle cx="90" cy="312" r="8" fill="#0E1413" stroke="#B9C7C0" stroke-width="2"/><text x="90" y="352" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="400" fill="#B9C7C0" text-anchor="middle" letter-spacing="2.2">PLAN</text><circle cx="335" cy="312" r="8" fill="#0E1413" stroke="#B9C7C0" stroke-width="2"/><text x="335" y="352" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="400" fill="#B9C7C0" text-anchor="middle" letter-spacing="2.2">RETRIEVE</text><circle cx="580" cy="312" r="8" fill="#0E1413" stroke="#B9C7C0" stroke-width="2"/><text x="580" y="352" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="400" fill="#B9C7C0" text-anchor="middle" letter-spacing="2.2">EXECUTE</text><circle cx="825" cy="312" r="24" fill="#F0B44C" opacity=".35" filter="url(#glow)"><animate attributeName="opacity" values=".15;.6;.15" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="825" cy="312" r="18" fill="#F0B44C"/><path d="M816 312.5l6 6 11.5-12.5" fill="none" stroke="#0E1413" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><text x="825" y="352" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="700" fill="#F0B44C" text-anchor="middle" letter-spacing="2.2">VERIFY</text><circle cx="1070" cy="312" r="8" fill="#0E1413" stroke="#B9C7C0" stroke-width="2"/><text x="1070" y="352" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="400" fill="#B9C7C0" text-anchor="middle" letter-spacing="2.2">DELIVER</text><path d="M825 366C825 402 760 402 690 402L225 402C155 402 90 402 90 368" fill="none" stroke="#F0B44C" stroke-width="1.8" stroke-dasharray="6 8" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.3s" repeatCount="indefinite"/></path><rect x="372" y="391" width="176" height="22" fill="#0E1413"/><text x="460" y="407" font-family="ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace" font-size="14.5" font-weight="400" fill="#F0B44C" text-anchor="middle" >errors loop back</text>
